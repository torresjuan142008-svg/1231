<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post tipo Facebook</title>

<style>
   body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
}

.fondo {
    position: fixed;
    top: -50px;   /* ajusta */
    left: -50px;  /* ajusta */
    width: 120%;
    height: 120%;
    background: url('libro.png') no-repeat center;
    background-size: cover;
    z-index: -1;
}
}
body {
    margin: 0;
    background: #18191a;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
}

/* CONTENEDOR */
.post {
    width: 100%;
    max-width: 400px;
    background: #242526;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
}
<div class="titulo">Nombre desconocido</div>
    .titulo {
    font-size: 28px;
    font-weight: bold;
    color: white;
    padding: 15px;
    text-align: center;
    background: linear-gradient(90deg, #ff004c, #ff6600);
    letter-spacing: 2px;
}
/* HEADER */
.header {
    display: flex;
    align-items: center;
    padding: 10px;
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: gray;
    margin-right: 10px;
}

.info {
    color: white;
}

.info span {
    display: block;
    font-size: 12px;
    color: #b0b3b8;
}

/* IMAGEN */
.img-container {
    position: relative;
}

.img-container img {
    width: 100%;
    height: 400px;
    object-fit: cover;
}

/* TEXTO ENCIMA */
.texto {
    position: absolute;
    bottom: 20px;
    left: 10px;
    color: white;
    font-size: 18px;
    background: rgba(0,0,0,0.5);
    padding: 5px 10px;
    border-radius: 10px;
}

/* REACCIONES */
.reacciones {
    padding: 10px;
    color: #b0b3b8;
    font-size: 14px;
    border-top: 1px solid #3a3b3c;
}

/* BOTONES */
.botones {
    display: flex;
    justify-content: space-around;
    padding: 10px;
    border-top: 1px solid #3a3b3c;
}

.botones div {
    color: #b0b3b8;
    cursor: pointer;
}

.botones div:hover {
    color: white;
}
</style>

</head>

<body>

<div class="post">

    <div class="header">
        <div class="avatar"></div>
        <div class="info">
            Juan Torres
            <span>Hace 1 hora</span>
        </div>
    </div>

    <div class="img-container">
        <img src="pagina.png">
        <div class="texto">versículo 1</div>
    </div>

    <div class="reacciones">
        👍 120 · ❤️ 45 comentarios
    </div>

    <div class="botones">
        <div>👍 Me gusta</div>
        <div>💬 Comentar</div>
        <div>↗ Compartir</div>
    </div>

</div>

</body>
</html>
